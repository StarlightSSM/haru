<!doctype html>
<html><head><meta charset="utf-8"></head><body style="margin:0;background:#ddd">
<canvas id="c" width="1600" height="900"></canvas>
<script src="../src/js/vendor/three-bundle.js"></script>
<script src="../src/js/util.js"></script>
<script src="../src/js/character.js"></script>
<script src="../src/js/char3d.js"></script>
<script>
  window.shoot = (cfgOverride) => {
    const T = THREE;
    const canvas = document.getElementById('c');
    const r = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
    r.setSize(1600, 900, false); r.shadowMap.enabled = true;
    const scene = new T.Scene(); scene.background = new T.Color('#e9e4dc');
    scene.add(new T.HemisphereLight('#ffffff', '#b9a68f', 1.6));
    const sun = new T.DirectionalLight('#fff1dc', 2.2); sun.position.set(2, 3, 3); sun.castShadow = true; scene.add(sun);
    const floor = new T.Mesh(new T.PlaneGeometry(10, 10), H.toon('#cfb79a')); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const cfg = Object.assign({}, H.DEFAULT_CHARACTER, cfgOverride || {});
    const poses = [
      { act: 'idle', rot: 0, label: 'idle front' }, { act: 'happy', rot: 0.6, label: 'happy 3/4', emo: 'happy' },
      { act: 'type', rot: -0.5, seated: true, label: 'type seated', emo: 'focus' }, { act: 'paint', rot: 1.2, label: 'paint' },
    ];
    const chars = poses.map((p, i) => {
      const c = new H.Character3D(cfg); c.root.position.set(-2.1 + i * 1.4, 0, 0); c.root.rotation.y = p.rot; scene.add(c.root);
      for (let k = 0; k < 40; k++) c.update(1 / 30, { t: 1 + k / 30, act: p.act, emo: p.emo || 'neutral', seated: p.seated, seatH: 0.5, blink: 1, look: { x: 0, y: 0 } });
      return c;
    });
    const cam = new T.PerspectiveCamera(30, 16 / 9, 0.1, 50); cam.position.set(0, 1.3, 5.2); cam.lookAt(0, 0.8, 0);
    r.render(scene, cam);
    const out = [canvas.toDataURL('image/png')];
    /* close-up of the face */
    const cam2 = new T.PerspectiveCamera(22, 16 / 9, 0.05, 50);
    const hp = chars[0].headWorld(new T.Vector3());
    cam2.position.set(hp.x + 0.15, hp.y - 0.12, hp.z + 1.0); cam2.lookAt(hp.x, hp.y - 0.17, hp.z);
    r.render(scene, cam2); out.push(canvas.toDataURL('image/png'));
    return out;
  };
</script>
</body></html>
